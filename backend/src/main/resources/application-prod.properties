# ================================================================
# Database (MySQL production profile)
# Activate with: spring.profiles.active=mysql
# Provide DB_URL, DB_USERNAME, DB_PASSWORD via environment or backend/.env
# ================================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/diyan_exports}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console not needed in production
spring.h2.console.enabled=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
