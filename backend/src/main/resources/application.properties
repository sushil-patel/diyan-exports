spring.application.name=diyan-exports

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# A. DB properties

# Connection Settings
spring.datasource.url=jdbc:h2:mem:de;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CORS Configurations
app.cors.allowed-origins=*

# Enquiry endpoint basic-auth credentials (overridable via backend/.env: ENQUIRY_USERNAME, ENQUIRY_PASSWORD)
app.enquiry.username=${ENQUIRY_USERNAME}
app.enquiry.password=${ENQUIRY_PASSWORD}

# Delay data.sql execution until Hibernate has finished creating the database schema
spring.jpa.defer-datasource-initialization=true

# Explicitly tell Spring Boot to always initialize the database using data.sql
spring.sql.init.mode=always